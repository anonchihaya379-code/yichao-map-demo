<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>异潮</title><style>html,body{margin:0;background:transparent}.boot-shell{position:absolute;right:8%;bottom:22px;width:64px;height:64px}.boot-shell .boot{border:0;background:transparent;font:11px/1.4 serif;color:#d7edf8}.boot button{border:0;background:#123c5e;color:#e1f9ff;padding:7px;border-radius:9px;cursor:pointer}</style></head><body><div id="tide-mount" data-huohu-floating><section class="boot-shell" aria-label="异潮悬浮终端"><div class="boot"><span>连接中…</span><button type="button" data-retry hidden>重试</button></div></section></div><script>const resourceBases=["./"].map(x=>new URL(x,document.baseURI).href);window.TIDE_RESOURCE_BASES=resourceBases;function loadResource(tag,url){return new Promise((resolve,reject)=>{const el=document.createElement(tag),timer=setTimeout(()=>{el.remove();reject(Error('timeout'))},15000);if(tag==='link'){el.rel='stylesheet';el.href=url}else{el.src=url;el.async=false}el.onload=()=>{clearTimeout(timer);resolve(el)};el.onerror=()=>{clearTimeout(timer);el.remove();reject(Error('network'))};document.head.append(el)})}let connecting=false;async function connect(){if(connecting)return;connecting=true;document.querySelector('[data-retry]').hidden=true;for(const base of resourceBases){let css;try{css=await loadResource('link',base+'theme.css');if(!window.Vue)await loadResource('script','https://cdn.jsdelivr.net/npm/vue@3.5.21/dist/vue.global.prod.js');await loadResource('script',base+'app.js');connecting=false;return}catch{css?.remove()}}document.querySelector('.boot span').textContent='连接失败';document.querySelector('[data-retry]').hidden=false;connecting=false}document.querySelector('[data-retry]').onclick=connect;connect()</script></body></html>
